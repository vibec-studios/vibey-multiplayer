services:
  relay:
    build: .
    restart: unless-stopped
    ports:
      - "25565:25565"   # Minecraft players and hosts
      - "8765:8765"     # /status and /health for the status proxy
    environment:
      # vibey.henny.dev and vibe.henny.dev: official builds only, see SERVICES.md
      # (https://github.com/vibec-studios/.github/blob/main/SERVICES.md). Use your own domain and backend.
      DOMAIN: vibey.henny.dev   # wildcard DNS (DNS only, no proxy): *.vibey.henny.dev -> this server
      PORT: "25565"
      HTTP_PORT: "8765"
      MAX_HOSTS_PER_ACCOUNT: "2"   # without backend / backend down in fail-open mode
      # Optional Vibe Backend (put the secret in a .env file next to this one, never in git):
      BACKEND_URL: ${BACKEND_URL:-}          # e.g. https://vibe.henny.dev
      BACKEND_SECRET: ${BACKEND_SECRET:-}
      BACKEND_FAIL_MODE: ${BACKEND_FAIL_MODE:-open}
      RELAY_ID: ${RELAY_ID:-}             # defaults to DOMAIN
    volumes:
      - addresses:/data
volumes:
  addresses:
