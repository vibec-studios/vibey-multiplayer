version = project.mod_version
group = project.maven_group

java {
    toolchain.languageVersion = JavaLanguageVersion.of(project.ext.javaVersion)
    withSourcesJar()
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(project.ext.javaVersion)
}

// The default relay is baked into the jar so it can be changed in one place (root gradle.properties).
def generatedDir = layout.buildDirectory.dir('generated/vibey')
def genTask = tasks.register('generateBuildInfo') {
    def relay = project.default_relay
    def ver = project.version.toString()
    inputs.property('relay', relay)
    inputs.property('version', ver)
    outputs.dir(generatedDir)
    doLast {
        def f = generatedDir.get().file('dev/henny/vibey/BuildInfo.java').asFile
        f.parentFile.mkdirs()
        f.text = """package dev.henny.vibey;

/** Generated by gradle/common.gradle. */
public final class BuildInfo {
    public static final String VERSION = "${ver}";
    public static final String DEFAULT_RELAY = "${relay}";
    private BuildInfo() {}
}
"""
    }
}
sourceSets.main.java.srcDir(generatedDir)
tasks.named('compileJava') { dependsOn genTask }
afterEvaluate {
    tasks.matching { it.name == 'sourcesJar' }.configureEach { dependsOn genTask }
}

jar {
    from(rootProject.file('LICENSE')) { rename { "LICENSE_vibey" } }
}
